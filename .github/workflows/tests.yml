name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the pinned environment
        run: pip install -r requirements-lock.txt -r website/requirements.txt -e analysis -e server
      - name: Check ESA recovery imports
        run: env PYTHONPATH=analysis python -m pytest -q analysis/tests/test_esa_fit_adjusted_control_recovery.py
      - name: Test public checkout
        env:
          LLL_PUBLIC_CHECKOUT_TESTS: '1'
          PYTEST_ADDOPTS: '-rs'
        run: env PYTHONPATH=analysis python -m lll.studies test
