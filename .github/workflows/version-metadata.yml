name: Version metadata
on: [push, pull_request]
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e 'analysis[test]' -e 'server[test]'
      - run: python -m pytest server/tests/test_version.py
