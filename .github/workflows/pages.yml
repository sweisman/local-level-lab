name: pages

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install website renderer and tests
        run: python -m pip install -r website/requirements.txt pytest==9.1.1
      - name: Test website build
        run: python -m pytest website/tests -q
      - name: Build public documentation
        run: python website/build.py --output _site
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
