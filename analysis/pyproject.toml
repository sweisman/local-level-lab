[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lll"
version = "0.1.0"
description = "Local Level Lab: analysis of crowdsourced in-flight IMU recordings"
license = "AGPL-3.0-or-later"
authors = [{ name = "Scott Weisman" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
lll = "lll.cli:main"

[tool.setuptools]
packages = ["lll"]
