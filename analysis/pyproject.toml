[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lll"
dynamic = ["version"]
description = "Local Level Lab: analysis of crowdsourced in-flight IMU recordings"
license = "AGPL-3.0-or-later"
authors = [{ name = "Scott Weisman" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7", "pygeomag>=1.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
lll = "lll.cli:main"

[tool.setuptools]
packages = ["lll"]

[tool.setuptools.dynamic]
version = {attr = "lll.__version__"}

[tool.setuptools.package-data]
lll = ["logo.png"]
